<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="mcp-upb">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="0.55" stop-color="#11785a"/>
      <stop offset="1" stop-color="#1fb486"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff5d6"/>
      <stop offset="1" stop-color="#5fe0b5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- node graph motif -->
  <g stroke="url(#accent)" stroke-width="2.5" opacity="0.55" fill="none">
    <line x1="935" y1="90" x2="1040" y2="150"/>
    <line x1="935" y1="90" x2="935" y2="230"/>
    <line x1="1040" y1="150" x2="935" y2="230"/>
    <line x1="1040" y1="150" x2="1110" y2="95"/>
    <line x1="935" y1="230" x2="1055" y2="255"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="935" cy="90" r="13"/>
    <circle cx="1040" cy="150" r="17"/>
    <circle cx="1110" cy="95" r="10"/>
    <circle cx="935" cy="230" r="13"/>
    <circle cx="1055" cy="255" r="9"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" fill="#ffffff" filter="url(#soft)">mcp-upb</text>
  <text x="84" y="205" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#d7fff0">Your university LMS, as an MCP server</text>
  <text x="84" y="248" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#9ff5d6">Courses · Assignments · Grades · Deadlines · Sync — over the Moodle REST API</text>

  <rect x="84" y="270" width="64" height="6" rx="3" fill="url(#accent)"/>
</svg>
